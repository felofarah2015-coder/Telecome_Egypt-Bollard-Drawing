<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Viewer</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
            margin:0;
            padding:20px;
        }

        .container{
            max-width:1280px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
            text-align:center;
        }

        img{
            width:100%;
            border-radius:10px;
            margin-bottom:20px;
        }

        h1{
            color:#003366;
        }

        .btn{
            display:block;
            margin:15px auto;
            padding:15px;
            width:80%;
            background:#0066cc;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-size:18px;
        }

        .btn:hover{
            background:#004999;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>TECH ELECTRIQUE</h1>

    <h2>Drawing Viewer</h2>

    <h3>Telecom Egypt</h3>

    <img src="drawing.JPG" alt="Drawing Preview">

    <a class="btn" href="drawing.pdf" target="_blank">
        📄 عرض الرسمة PDF
    </a>

    <a class="btn" href="drawing.pdf" download>
        ⬇ تحميل الرسمة PDF
    </a>

</div>

</body>
</html>
